name = "raven_tests"
description = "Tests for Raven VM"
version = "0.1.0-dev"

authors = ["Fraser Wilson"]
maintainers = ["Fraser Wilson <fraser@thewhitelion.eu>"]
maintainers-logins = ["blancolioni"]
licenses = "GPL-3.0-or-later"
website = ""
tags = ["test", "wren", "vm"]

executables = ["raven_tests"]

[build-profiles]
"*" = "development"

[build-switches]
"*".ada_version = "ada2022"
Development.Runtime_Checks = "Everything"
# The defaults Alire gives for "yes", and two more: subprogram bodies
# in alphabetical order (o), and a separate spec for every body (s).
"*".Style_Checks = ["-gnaty3", "-gnatya", "-gnatyA", "-gnatyB", "-gnatyb", "-gnatyc", "-gnaty-d", "-gnatye", "-gnatyf", "-gnatyh", "-gnatyi", "-gnatyI", "-gnatyk", "-gnatyl", "-gnatym", "-gnatyn", "-gnatyO", "-gnatyo", "-gnatyp", "-gnatyr", "-gnatyS", "-gnatys", "-gnatyt", "-gnatyu", "-gnatyx"]
development.contracts = "yes"
"*".compile_checks = "errors"

[[depends-on]]
resources = "~0.1.0"
raven = "*"

[[pins]]
raven = { path = ".." }

